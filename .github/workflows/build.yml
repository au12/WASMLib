name: build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  wasm:
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish the release when package.json's version is new
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git ~/emsdk
          ~/emsdk/emsdk install 7.0.0 && ~/emsdk/emsdk activate 7.0.0
      - name: Ninja
        run: sudo apt-get install -y ninja-build
      - name: Build the module and upstream's SM_API test suite
        run: source ~/emsdk/emsdk_env.sh && tools/build.sh test
      - name: WASMLib's own checks
        run: node test/smoke.mjs && node test/api.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: wasmlib
          path: dist/
      # Bump "version" in package.json on main and this publishes release v<version> with the
      # built dist/ attached. Notes come from CHANGELOG.md ("## <version>") or GitHub's generated notes.
      - name: Publish release if the version is new
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $tag already exists, nothing to do."
            exit 0
          fi
          : > notes.md
          if [ -f CHANGELOG.md ]; then
            awk -v v="$version" '
              /^## / { if (found) exit; h = $2; gsub(/[\[\]v]/, "", h); if (h == v) { found = 1; next } }
              found
            ' CHANGELOG.md > notes.md
          fi
          if [ -s notes.md ]; then notes=(--notes-file notes.md); else notes=(--generate-notes); fi
          (cd dist && zip -qr "../wasmlib-$version.zip" .)
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$tag" "${notes[@]}" "wasmlib-$version.zip"
